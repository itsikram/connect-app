# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# Keep this moderate; EAS also injects GRADLE_OPTS on the builder.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# AndroidX package structure
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Architectures to build. EAS release builds can still filter ABIs in app/build.gradle.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Keep the old architecture: several native modules in this app are not New Arch ready.
newArchEnabled=false

# Use Hermes
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
edgeToEdgeEnabled=false

# Enable GIF support in React Native images
expo.gif.enabled=true
# Enable webp support in React Native images
expo.webp.enabled=true
# Animated webp is large and unused here
expo.webp.animated=false

# Enable network inspector in development builds
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Compress native libraries in the APK (matches previous local packaging).
expo.useLegacyPackaging=true

# Minify / shrink release builds
android.enableMinifyInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true

# NDK is provided by the EAS image (sdk-54 uses NDK r27b). Do not hardcode a local Windows path.
android.ndkVersion=27.1.12297006
android.compileSdkVersion=36
android.buildToolsVersion=36.0.0

# Versions for WebView / Kotlin
ReactNativeWebView_webkitVersion=1.11.0
ReactNativeWebView_kotlinVersion=2.1.20
